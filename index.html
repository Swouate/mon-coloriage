<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Coloriage</title>
  <meta name="description" content="Transforme un dessin en couleur en page à colorier, même hors ligne.">
  <meta name="theme-color" content="#ff7a59">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coloriage">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Mon Coloriage</h1>
    <p>Transforme un dessin en couleur en page à colorier.</p>
  </header>

  <main>
    <label id="drop" class="drop">
      <input id="file" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.heic,.heif,.avif">
      <span class="big">Choisir une image</span>
      <span class="small">JPEG, PNG, WebP, GIF, BMP, HEIC (iPhone)…</span>
    </label>
    <p id="error" class="error" hidden></p>

    <section id="editor" hidden>
      <div class="preview">
        <canvas id="page" aria-label="Aperçu du coloriage"></canvas>
        <div id="busy" class="busy" hidden>Création en cours…</div>
      </div>

      <div class="panel">
        <div class="presets">
          <button type="button" data-preset="dessin">Dessin / BD</button>
          <button type="button" data-preset="photo">Photo</button>
        </div>
        <label>Contours entre les couleurs <input id="detail" type="range" min="0" max="100"></label>
        <label>Traits noirs du dessin <input id="ink" type="range" min="0" max="100"></label>
        <label>Nettoyage des petits points <input id="clean" type="range" min="0" max="100"></label>
        <label>Épaisseur des traits <input id="thickness" type="range" min="0" max="3" step="1"></label>
        <label class="check"><input id="withThumb" type="checkbox" checked> Modèle en couleur en haut à gauche</label>
        <label class="check"><input id="autoCrop" type="checkbox" checked> Recadrer sur le personnage</label>

        <div class="actions">
          <button type="button" id="dlPng" class="primary">Télécharger PNG</button>
          <button type="button" id="dlPdf" class="primary">Télécharger PDF</button>
          <button type="button" id="share">Partager / Imprimer</button>
          <button type="button" id="again">Nouvelle image</button>
        </div>
      </div>
    </section>
  </main>

  <footer>Fonctionne sans connexion une fois installée. Les images restent sur votre appareil.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
